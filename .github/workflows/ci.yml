name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Syntax, translations, plg, version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # version check: pull requests against their target branch, pushes to main against the previous state of main
      - name: Base for the version check
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "args=--base origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "args=--base ${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi
      - name: Checks
        run: python3 tools/ci_checks.py ${{ steps.base.outputs.args }}

  backend:
    name: Backend (api.php / actions.php, fake docker CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Backend tests
        run: |
          python3 tests/bench/backend/test_backend.py
          python3 tests/bench/backend/test_monitor.py
