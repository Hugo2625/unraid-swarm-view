name: UI tests

# Runs the original Unraid Docker page with Folder View 3/2, Compose Manager and Swarm View in headless Chrome
# (tests/bench). Pull requests: quick set with 1 worker. Nightly and on demand: all scenarios with 1, 2 and 6 workers.
# Unraid code: the webgui of a stable release as it was on its release day (tests/bench/unraid_version.py) – by default
# the latest release, or the given versions; Folder View and Compose Manager: their current state.
# New Unraid releases trigger this via unraid-release.yml. All versions of one run are published together.
on:
  pull_request:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      unraid_version:
        description: 'Unraid version(s): empty = latest stable release · "7.3.6" or "7.2.9 7.3.6" · "lines" = newest of each 7.x line · "all" = every release since 7.0'
        required: false
        default: ''
      webgui_ref:
        description: 'or a webgui branch/commit (e.g. master, 7.3) – overrides the version'
        required: false
        default: ''
  workflow_call:
    inputs:
      unraid_version:
        type: string
        required: false
        default: ''
      webgui_ref:
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  plan:
    name: Unraid versions to test
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.plan.outputs.versions }}
    steps:
      - uses: actions/checkout@v6
      - id: plan
        env:
          SPEC: ${{ inputs.unraid_version }}
          REF: ${{ inputs.webgui_ref }}
        run: |
          if [ -n "$REF" ]; then
            echo 'versions=[""]' >> "$GITHUB_OUTPUT"; echo "webgui \`$REF\`" >> "$GITHUB_STEP_SUMMARY"
          else
            python3 tests/bench/unraid_version.py --plan "$SPEC" --github-output | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  ui:
    name: UI (Unraid ${{ matrix.version || inputs.webgui_ref }}, ${{ matrix.workers }} worker)
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ui-${{ github.ref }}-${{ matrix.version || inputs.webgui_ref }}-${{ matrix.workers }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.plan.outputs.versions) }}
        workers: ${{ fromJSON(github.event_name == 'pull_request' && '[1]' || '[1, 2, 6]') }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/bench/requirements.txt
      - name: Cache the Playwright browser
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/bench/requirements.txt') }}
      - name: Install Playwright
        run: |
          pip install -r tests/bench/requirements.txt
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            python -m playwright install-deps chromium
          else
            python -m playwright install --with-deps chromium
          fi
      - name: Build the fake Unraid (web root, plugins, flash config)
        env:
          UNRAID_VERSION: ${{ matrix.version }}
          WEBGUI_REF: ${{ inputs.webgui_ref }}
        run: sudo --preserve-env=UNRAID_VERSION,WEBGUI_REF tests/bench/setup.sh
      - name: Start the bench server
        run: |
          sudo nohup tests/bench/server.sh > /tmp/bench-server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null 'http://127.0.0.1:8090/Docker?s=default' && exit 0; sleep 1; done
          cat /tmp/bench-server.log; exit 1
      - name: Run scenarios
        run: python tests/bench/run_tests.py --workers ${{ matrix.workers }} ${{ github.event_name == 'pull_request' && '--quick' || '' }} --jobs 4 --chrome none
      - name: Summary
        if: always()
        run: |
          r=$(ls -d tests/bench/out*/report.md 2>/dev/null | head -1)
          [ -n "$r" ] && { sed -n '1,5p' "$r"; grep -E '^## ❌' "$r" || true; } >> "$GITHUB_STEP_SUMMARY"
          g=$(ls -d tests/bench/out*/gallery 2>/dev/null | head -1)
          [ -n "$g" ] && { echo; echo "**Screenshots** (artifact *screenshots-${{ matrix.version || 'ref' }}-${{ matrix.workers }}-worker*): $(ls "$g" | sed 's/\.png$//' | paste -sd ',' | sed 's/,/, /g')"; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: screenshots-${{ matrix.version || 'ref' }}-${{ matrix.workers }}-worker
          path: tests/bench/out*/gallery/
          retention-days: 30
      - name: Upload full report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ui-report-${{ matrix.version || 'ref' }}-${{ matrix.workers }}-worker
          path: |
            tests/bench/out*/
            /tmp/bench-server.log
          retention-days: 14

  # Nightly / manual / new-release runs on main: publish report + screenshots of all variants (GitHub Pages)
  pages:
    name: Build results page
    needs: ui
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - name: Collect the results of all variants, add them to the history of the published page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'ui-report-*' --dir results
          # the published page is the archive: history.json + page and screenshots of the latest run per Unraid version
          url=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url 2>/dev/null || true)
          [ -n "$url" ] || url="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          python3 tests/bench/make_site.py site $(find results -name results.json -exec dirname {} \; | sort) --prev "$url"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # separate job (GitHub's pattern): the pages artifact of the job above is complete and listed before deploy-pages
  # looks for it – in the same job it was sometimes not found yet ("No artifacts named github-pages")
  deploy:
    name: Publish results page
    needs: pages
    if: always() && needs.pages.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v5
