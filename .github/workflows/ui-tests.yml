name: UI tests

# Runs the original Unraid Docker page with Folder View 3/2, Compose Manager and Swarm View in headless Chrome
# (tests/bench). Pull requests: quick set with 1 worker. Nightly and on demand: all scenarios with 1, 2 and 6 workers.
# Unraid code: the latest stable release line (tests/bench/unraid_version.py) unless a version/branch is given;
# Folder View and Compose Manager: their current state. New Unraid releases trigger this via unraid-release.yml.
on:
  pull_request:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      unraid_version:
        description: 'Unraid version (e.g. 7.3.6) – empty = latest stable release'
        required: false
        default: ''
      webgui_ref:
        description: 'or a webgui branch/commit (e.g. master, 7.3) – overrides the version'
        required: false
        default: ''
  workflow_call:
    inputs:
      unraid_version:
        type: string
        required: false
        default: ''
      webgui_ref:
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  ui:
    name: UI (${{ matrix.workers }} worker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ui-${{ github.ref }}-${{ inputs.unraid_version || inputs.webgui_ref || 'latest' }}-${{ matrix.workers }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        workers: ${{ fromJSON(github.event_name == 'pull_request' && '[1]' || '[1, 2, 6]') }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/bench/requirements.txt
      - name: Cache the Playwright browser
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/bench/requirements.txt') }}
      - name: Install Playwright
        run: |
          pip install -r tests/bench/requirements.txt
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            python -m playwright install-deps chromium
          else
            python -m playwright install --with-deps chromium
          fi
      - name: Build the fake Unraid (web root, plugins, flash config)
        env:
          UNRAID_VERSION: ${{ inputs.unraid_version }}
          WEBGUI_REF: ${{ inputs.webgui_ref }}
        run: sudo --preserve-env=UNRAID_VERSION,WEBGUI_REF tests/bench/setup.sh
      - name: Start the bench server
        run: |
          sudo nohup tests/bench/server.sh > /tmp/bench-server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null 'http://127.0.0.1:8090/Docker?s=default' && exit 0; sleep 1; done
          cat /tmp/bench-server.log; exit 1
      - name: Run scenarios
        run: python tests/bench/run_tests.py --workers ${{ matrix.workers }} ${{ github.event_name == 'pull_request' && '--quick' || '' }} --jobs 4 --chrome none
      - name: Summary
        if: always()
        run: |
          r=$(ls -d tests/bench/out*/report.md 2>/dev/null | head -1)
          [ -n "$r" ] && { sed -n '1,5p' "$r"; grep -E '^## ❌' "$r" || true; } >> "$GITHUB_STEP_SUMMARY"
          g=$(ls -d tests/bench/out*/gallery 2>/dev/null | head -1)
          [ -n "$g" ] && { echo; echo "**Screenshots** (artifact *screenshots-${{ matrix.workers }}-worker*): $(ls "$g" | sed 's/\.png$//' | paste -sd ',' | sed 's/,/, /g')"; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: screenshots-${{ matrix.workers }}-worker
          path: tests/bench/out*/gallery/
          retention-days: 30
      - name: Upload full report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ui-report-${{ matrix.workers }}-worker
          path: |
            tests/bench/out*/
            /tmp/bench-server.log
          retention-days: 14

  # Nightly / manual / new-release runs on main: publish report + screenshots of all variants (GitHub Pages)
  pages:
    name: Publish results page
    needs: ui
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Collect the results of all variants
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'ui-report-*' --dir results
          python3 tests/bench/make_site.py site $(find results -name results.json -exec dirname {} \; | sort)
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v5
